name: "🔎 Static Testing / Task Review"
description: "Review a proposed task before implementation to detect ambiguity, weak scope, missing contracts, and untestable acceptance criteria."
title: "[STATIC-TEST] "
labels:
  - "type:review"
  - "type:static-testing"
  - "status:triage"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## BrikByte Studios Static Testing / Task Review

        Use this template to review a task **before implementation**.

        This is a **quality gate for task definition**.

        The goal is not to code yet.  
        The goal is to determine whether the task is:

        - clear
        - bounded
        - testable
        - unambiguous
        - implementation-ready
        - production-grade

        ---

        ## Core Principle

        > A vague task produces vague code.  
        > A precise task produces deterministic execution.

        ---

        ## Review Outcomes

        Every static test review should produce:

        - identified ambiguities
        - identified gaps / risks
        - identified assumptions
        - reviewed contracts / interfaces
        - a revised production-grade task definition
        - stronger acceptance criteria
        - recommended tests
        - a readiness verdict

        ---

        ## Readiness Verdict

        - ✅ READY
        - ⚠️ NEEDS REVISION
        - ❌ NOT READY

  - type: input
    id: task_summary
    attributes:
      label: Task summary
      description: One-line summary of the task being reviewed.
      placeholder: "Implement release score summary output for inspect command"
    validations:
      required: true

  - type: textarea
    id: original_task
    attributes:
      label: Original task definition
      description: Paste the task exactly as currently written.
      placeholder: |
        Paste the full original task here.
    validations:
      required: true

  - type: textarea
    id: task_intent
    attributes:
      label: Intended outcome
      description: What is this task trying to achieve?
      placeholder: |
        Intended outcome:
        - ...

        Why this task exists:
        - ...
    validations:
      required: true

  - type: input
    id: repository_area
    attributes:
      label: Repository / area
      description: Primary repository and subsystem affected.
      placeholder: "bb-cli / internal/reporting"
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      description: Select the type of work being reviewed.
      options:
        - Feature
        - Improvement
        - Refactor
        - Bug Fix
        - Reliability
        - Performance
        - Security
        - Documentation
        - Developer Experience
        - Build / CI
        - Test Infrastructure
        - Governance
        - UI / UX
    validations:
      required: true

  - type: textarea
    id: scope_review
    attributes:
      label: Scope review
      description: Assess whether the task scope is clear and bounded.
      placeholder: |
        In scope:
        - ...

        Implied but unstated:
        - ...

        Potential scope creep:
        - ...

        Should be out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: ambiguity_review
    attributes:
      label: Ambiguity review
      description: Identify unclear, vague, overloaded, or non-testable wording.
      placeholder: |
        Ambiguous wording:
        - "robust"
        - "improve"
        - "handle properly"
        - "user-friendly"

        Why it is ambiguous:
        - ...
    validations:
      required: true

  - type: textarea
    id: assumptions_review
    attributes:
      label: Hidden assumptions
      description: Identify assumptions that the task relies on but does not explicitly state.
      placeholder: |
        Hidden assumptions:
        - A schema already exists.
        - The command output format is already agreed.
        - Consumers can tolerate changed output.
        - The data source is always available.
    validations:
      required: true

  - type: textarea
    id: missing_information
    attributes:
      label: Missing information
      description: List information needed for the task to be executable without guesswork.
      placeholder: |
        Missing information:
        - Input contract
        - Output format
        - Error behavior
        - Ordering rules
        - Compatibility expectations
        - Examples / fixtures
    validations:
      required: true

  - type: textarea
    id: interface_contract_review
    attributes:
      label: Contract / interface review
      description: Review inputs, outputs, schemas, side effects, invariants, and dependencies.
      placeholder: |
        Inputs:
        - ...

        Outputs:
        - ...

        Schemas:
        - ...

        Side effects:
        - ...

        Invariants:
        - ...

        Dependencies:
        - ...
    validations:
      required: true

  - type: textarea
    id: risk_review
    attributes:
      label: Risk review
      description: Identify risks if the task is implemented as currently written.
      placeholder: |
        Risks:
        - Inconsistent interpretation by developer
        - Breaking existing consumers
        - Missing edge-case behavior
        - Scope creep
        - Untestable completion
        - Weak regression protection
    validations:
      required: true

  - type: textarea
    id: first_principles_questions
    attributes:
      label: First-principles questions
      description: Ask the fundamental questions that must be answered for the task to be sound.
      placeholder: |
        First-principles questions:
        - What exact problem is being solved?
        - What is the minimal correct outcome?
        - What inputs drive this behavior?
        - What output proves success?
        - What must remain unchanged?
        - What can fail?
        - How must failure appear?
    validations:
      required: true

  - type: textarea
    id: testability_review
    attributes:
      label: Testability review
      description: Evaluate whether the task can be validated objectively.
      placeholder: |
        Testability observations:
        - Can success be proven?
        - Are acceptance criteria binary?
        - Can unit tests be derived?
        - Can integration tests be derived?
        - Can regression tests be derived?
        - Are fixtures or golden files needed?
    validations:
      required: true

  - type: textarea
    id: issues_found
    attributes:
      label: Issues found
      description: Summarize the concrete issues found during static testing.
      placeholder: |
        Issues found:
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: clarification_requests
    attributes:
      label: Required clarifications
      description: List the exact clarifications required to make the task stronger.
      placeholder: |
        Clarifications needed:
        - Define input source.
        - Define output ordering.
        - Define failure behavior.
        - Define compatibility constraints.
    validations:
      required: true

  - type: textarea
    id: revised_task
    attributes:
      label: Refined production-grade task definition
      description: Rewrite the task into a clear, implementation-ready, production-grade version.
      placeholder: |
        Refined task definition:

        Implement ...

        The implementation must ...

        The task is complete when ...
    validations:
      required: true

  - type: textarea
    id: revised_scope
    attributes:
      label: Refined scope
      description: Clearly restate in-scope and out-of-scope items.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: non_functional_requirements
    attributes:
      label: Non-functional requirements
      description: Define production-grade quality expectations.
      placeholder: |
        Non-functional requirements:
        - Deterministic behavior
        - Clear error handling
        - Backward-compatible output where required
        - No hidden side effects
        - Safe defaults
        - Maintainable implementation
        - Observable failure modes
        - Tests for positive, negative, edge, and regression cases
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria_revised
    attributes:
      label: Refined acceptance criteria
      description: Provide binary, testable, deterministic acceptance criteria.
      placeholder: |
        - [ ] Input contract is explicitly defined.
        - [ ] Output format is explicitly defined with examples.
        - [ ] Missing-data behavior is specified.
        - [ ] Error behavior is specified.
        - [ ] Output ordering is deterministic.
        - [ ] Existing behavior remains unchanged unless explicitly stated.
        - [ ] Unit tests cover positive, negative, and edge cases.
        - [ ] Integration tests cover the main user workflow where applicable.
        - [ ] Regression tests protect existing contracts.
        - [ ] Documentation is updated if user-visible behavior changes.
    validations:
      required: true

  - type: textarea
    id: recommended_tests
    attributes:
      label: Recommended tests
      description: List the tests that should exist if this task proceeds.
      placeholder: |
        Recommended tests:
        - Positive case:
        - Negative case:
        - Edge case:
        - Regression case:
        - Determinism test:
        - Contract compatibility test:
    validations:
      required: true

  - type: dropdown
    id: readiness_verdict
    attributes:
      label: Readiness verdict
      description: Is the task ready for implementation after review?
      options:
        - READY
        - NEEDS REVISION
        - NOT READY
    validations:
      required: true

  - type: textarea
    id: next_action
    attributes:
      label: Next action
      description: What should happen next?
      placeholder: |
        Next action:
        - Approve for implementation.
        - Revise task and resubmit.
        - Split task into smaller tasks.
        - Create ADR first.
        - Define schema / contract first.
        - Add missing examples / fixtures first.
    validations:
      required: true

  - type: checkboxes
    id: review_checklist
    attributes:
      label: Review checklist
      description: Confirm the task has been professionally static tested.
      options:
        - label: Ambiguous wording has been identified.
        - label: Hidden assumptions have been identified.
        - label: Missing information has been identified.
        - label: Scope has been bounded.
        - label: Contracts and interfaces have been reviewed.
        - label: Risks have been identified.
        - label: The refined task definition is production-grade.
        - label: The refined task is implementation-ready.
        - label: Acceptance criteria are binary and testable.
        - label: Recommended tests have been defined.
        - label: A readiness verdict has been given.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related tasks, ADRs, docs, schemas, issues, or PRs.
      placeholder: |
        - ADR-000x
        - Related issue: #
        - Schema doc: ...
        - PR: ...
    validations:
      required: false